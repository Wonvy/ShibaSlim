<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ShibaSlim</title>
<!-- Applies the saved theme and language before the first paint. -->
<script src="i18n.js"></script>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand" data-t-title="gui.tagline">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="var(--accent)"/>
        <rect x="18" y="20" width="28" height="24" rx="3" fill="#fff"/>
        <path d="M22 39l6-7 5 5 4-4 5 6z" fill="var(--accent)"/>
        <path d="M8 32h6M50 32h6M11 28l4 4-4 4M53 28l-4 4 4 4" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <div class="title-line"><h1>ShibaSlim</h1><span class="version" id="version" hidden></span></div>
    </div>
    <div class="prefs">
      <label class="pref">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3a7 7 0 100 14V3z" fill="currentColor"/><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        <select id="theme" data-t-aria="prefs.theme" data-t-title="prefs.theme">
          <option value="system" data-t="prefs.theme.system"></option>
          <option value="light" data-t="prefs.theme.light"></option>
          <option value="dark" data-t="prefs.theme.dark"></option>
        </select>
      </label>
      <label class="pref">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 10h14M10 3c2.2 2 2.2 12 0 14M10 3c-2.2 2-2.2 12 0 14" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <select id="lang" data-t-aria="prefs.lang" data-t-title="prefs.lang">
          <option value="system" data-t="prefs.lang.system"></option>
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </label>
      <button type="button" class="ghost" id="update" data-t="gui.checkUpdate" hidden></button>
      <button type="button" class="ghost" id="quit" data-t="gui.quit" data-t-title="gui.quitTitle" hidden></button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <!-- One row per task, its settings beside it; what each row does is shown in the status bar below. -->
  <section class="card settings" id="settings" data-t-aria="gui.settingsLabel">
    <div class="opt" data-hint="compress">
      <label class="check" for="task-compress"><input type="checkbox" id="task-compress"><span data-t="gui.task.compress"></span></label>
      <div class="opt-controls" id="compress-fields">
        <input type="range" id="clarity" min="1" max="100" step="1" value="60" data-t-aria="gui.clarity" data-t-title="gui.clarityTitle">
        <output id="clarity-value" for="clarity" data-t-title="gui.clarity">60</output>
        <div class="presets" role="group" data-t-aria="gui.presetsLabel">
          <button type="button" data-clarity="30" data-t="gui.preset.small"></button>
          <button type="button" data-clarity="60" data-t="gui.preset.everyday"></button>
          <button type="button" data-clarity="85" data-t="gui.preset.high"></button>
        </div>
      </div>
    </div>

    <div class="opt" data-hint="sign">
      <label class="check" for="task-sign"><input type="checkbox" id="task-sign"><span data-t="gui.task.sign"></span></label>
      <div class="opt-controls" id="sign-fields" hidden>
        <input type="text" id="sign-author" maxlength="200" spellcheck="false" autocomplete="name" data-t-placeholder="gui.sign.author" data-t-aria="gui.sign.author">
        <input type="text" id="sign-company" maxlength="200" spellcheck="false" autocomplete="organization" data-t-placeholder="gui.sign.company" data-t-aria="gui.sign.company">
      </div>
    </div>

    <div class="opt" data-hint="names">
      <label class="check" for="task-names"><input type="checkbox" id="task-names"><span data-t="gui.task.names"></span></label>
    </div>

    <div class="opt" data-hint="images" id="images-row">
      <label class="check" for="task-images"><input type="checkbox" id="task-images"><span data-t="gui.task.images"></span></label>
      <div class="opt-controls" id="image-fields" hidden>
        <select id="image-width" data-t-aria="gui.images.width" data-t-title="gui.images.width">
          <option value="1280">1280 px</option>
          <option value="1920">1920 px</option>
          <option value="2560">2560 px</option>
          <option value="3840">3840 px</option>
          <option value="custom" data-t="gui.images.custom"></option>
        </select>
        <span class="unit-input" id="image-width-custom-wrap" hidden>
          <input type="number" id="image-width-custom" min="160" max="7680" step="1" inputmode="numeric" data-t-aria="gui.images.width" data-t-title="gui.images.width"><span>px</span>
        </span>
        <select id="image-format" data-t-aria="gui.images.format" data-t-title="gui.images.format">
          <option value="png">PNG</option>
          <option value="jpg">JPG</option>
        </select>
        <select id="image-pages" data-t-aria="gui.images.pages" data-t-title="gui.images.pages">
          <option value="all" data-t="gui.images.pagesAll"></option>
          <option value="cover" data-t="gui.images.pagesCover"></option>
          <option value="some" data-t="gui.images.pagesSome"></option>
        </select>
        <input type="text" id="pages-list" spellcheck="false" autocomplete="off" data-t-placeholder="gui.images.pagesPlaceholder" data-t-aria="gui.images.pages" hidden>
      </div>
    </div>

    <div class="opt" data-hint="save">
      <span class="opt-label" id="save-label" data-t="gui.saveTo"></span>
      <div class="opt-controls">
        <select id="place" aria-labelledby="save-label" hidden>
          <option value="beside" data-t="gui.place.beside"></option>
          <option value="same" data-t="gui.place.same"></option>
          <option value="replace" data-t="gui.place.replace"></option>
          <option value="folder" data-t="gui.place.folder"></option>
        </select>
        <div class="path-row" id="path-row">
          <input type="text" id="out-dir" spellcheck="false" autocomplete="off" aria-labelledby="save-label">
          <button type="button" id="pick-dir" data-t="gui.pick"></button>
          <button type="button" id="open-dir" data-t="gui.open"></button>
        </div>
      </div>
    </div>
  </section>

  <section class="card files" id="files" data-t-aria="gui.filesLabel">
    <div class="empty" id="empty">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 30V10m0 0l-7 7m7-7l7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 28v8a4 4 0 004 4h20a4 4 0 004-4v-8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <p class="big" data-t="gui.dropTitle"></p>
      <p class="hint" data-t="gui.dropHint"></p>
      <div class="actions">
        <button type="button" data-pick="files" data-t="gui.chooseFiles"></button>
        <button type="button" data-pick="folder" data-t="gui.chooseFolder"></button>
      </div>
    </div>
    <div class="list-head" id="list-head" hidden>
      <span data-t="gui.filesLabel"></span>
      <div class="actions">
        <button type="button" class="ghost" data-pick="files" data-t="gui.addFiles"></button>
        <button type="button" class="ghost" data-pick="folder" data-t="gui.addFolder"></button>
      </div>
    </div>
    <ul class="list" id="list"></ul>
  </section>

  <footer class="bottom">
    <div class="status"><span id="summary" class="summary"></span></div>
    <div class="actions">
      <button type="button" id="clear" class="ghost" data-t="gui.clear"></button>
      <button type="button" id="start" class="primary"></button>
    </div>
  </footer>
</div>

<input type="file" id="file-input" multiple accept=".pptx,.pptm,.ppsx,.ppsm,.potx,.potm" hidden>
<input type="file" id="folder-input" webkitdirectory multiple hidden>
<div class="overlay" id="overlay" hidden><div data-t="gui.dropOverlay"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<!-- Asked every time results are about to be written over the original files. -->
<dialog class="confirm" id="confirm-replace" aria-labelledby="confirm-title" aria-describedby="confirm-body">
  <h2 id="confirm-title" data-t="gui.replace.title"></h2>
  <p id="confirm-body"></p>
  <ul id="confirm-list"></ul>
  <div class="actions">
    <button type="button" data-answer="cancel" data-t="gui.cancel" autofocus></button>
    <button type="button" data-answer="replace" class="danger" data-t="gui.replace.confirm"></button>
  </div>
</dialog>
</body>
</html>
