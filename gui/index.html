<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ShibaSlim</title>
<!-- Applies the saved theme and language before the first paint. -->
<script src="i18n.js"></script>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="var(--accent)"/>
        <rect x="18" y="20" width="28" height="24" rx="3" fill="#fff"/>
        <path d="M22 39l6-7 5 5 4-4 5 6z" fill="var(--accent)"/>
        <path d="M8 32h6M50 32h6M11 28l4 4-4 4M53 28l-4 4 4 4" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <div>
        <h1>ShibaSlim</h1>
        <p class="tagline" data-t="gui.tagline"></p>
      </div>
    </div>
    <div class="prefs">
      <label class="pref">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3a7 7 0 100 14V3z" fill="currentColor"/><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        <select id="theme" data-t-aria="prefs.theme" data-t-title="prefs.theme">
          <option value="system" data-t="prefs.theme.system"></option>
          <option value="light" data-t="prefs.theme.light"></option>
          <option value="dark" data-t="prefs.theme.dark"></option>
        </select>
      </label>
      <label class="pref">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 10h14M10 3c2.2 2 2.2 12 0 14M10 3c-2.2 2-2.2 12 0 14" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <select id="lang" data-t-aria="prefs.lang" data-t-title="prefs.lang">
          <option value="system" data-t="prefs.lang.system"></option>
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </label>
      <button type="button" class="ghost" id="quit" data-t="gui.quit" data-t-title="gui.quitTitle" hidden></button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <section class="card settings" data-t-aria="gui.settingsLabel">
    <div class="field">
      <div class="field-head">
        <label for="clarity" data-t="gui.clarity"></label>
        <output id="clarity-value" for="clarity">60</output>
      </div>
      <div class="slider-row">
        <span class="end" data-t="gui.smaller"></span>
        <input type="range" id="clarity" min="1" max="100" step="1" value="60">
        <span class="end" data-t="gui.sharper"></span>
      </div>
      <div class="presets" role="group" data-t-aria="gui.presetsLabel">
        <button type="button" data-clarity="30" data-t="gui.preset.small"></button>
        <button type="button" data-clarity="60" data-t="gui.preset.everyday"></button>
        <button type="button" data-clarity="85" data-t="gui.preset.high"></button>
      </div>
      <p class="hint" id="clarity-detail"></p>
    </div>

    <div class="field">
      <div class="field-head"><label for="out-dir" data-t="gui.saveTo"></label></div>
      <div class="path-row">
        <input type="text" id="out-dir" spellcheck="false" autocomplete="off">
        <button type="button" id="pick-dir" data-t="gui.pick"></button>
        <button type="button" id="open-dir" data-t="gui.open"></button>
      </div>
      <p class="hint" data-t="gui.saveHint"></p>
    </div>
  </section>

  <section class="card files" id="files" data-t-aria="gui.filesLabel">
    <div class="empty" id="empty">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 30V10m0 0l-7 7m7-7l7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 28v8a4 4 0 004 4h20a4 4 0 004-4v-8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <p class="big" data-t="gui.dropTitle"></p>
      <p class="hint" data-t="gui.dropHint"></p>
      <div class="actions">
        <button type="button" data-pick="files" data-t="gui.chooseFiles"></button>
        <button type="button" data-pick="folder" data-t="gui.chooseFolder"></button>
      </div>
    </div>
    <div class="list-head" id="list-head" hidden>
      <span data-t="gui.filesLabel"></span>
      <div class="actions">
        <button type="button" class="ghost" data-pick="files" data-t="gui.addFiles"></button>
        <button type="button" class="ghost" data-pick="folder" data-t="gui.addFolder"></button>
      </div>
    </div>
    <ul class="list" id="list"></ul>
  </section>

  <footer class="bottom">
    <span id="summary" class="summary"></span>
    <div class="actions">
      <button type="button" id="clear" class="ghost" data-t="gui.clear"></button>
      <button type="button" id="start" class="primary"></button>
    </div>
  </footer>
</div>

<input type="file" id="file-input" multiple accept=".pptx,.pptm,.ppsx,.ppsm,.potx,.potm" hidden>
<input type="file" id="folder-input" webkitdirectory multiple hidden>
<div class="overlay" id="overlay" hidden><div data-t="gui.dropOverlay"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
