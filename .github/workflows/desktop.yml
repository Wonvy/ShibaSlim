# Builds the desktop app for macOS (Apple silicon and Intel), Windows and Linux.
#
# - Every push to main (except README/docs-only changes), and "Run workflow" on the Actions tab:
#   the installers are attached to that run as artifacts (sign in to GitHub to download them).
# - Push a tag such as v0.2.0: the installers are also published as a GitHub release for that tag,
#   which anyone can download from the Releases page.
#
# Online updates: with the repository secret TAURI_SIGNING_PRIVATE_KEY set (the private key made by
# `tauri signer generate`, see README), builds also produce signed update bundles, and releases carry
# latest.json, which installed apps check. Without it everything still builds, minus online updates.
#
# Code signing: macOS builds are ad-hoc signed and Windows builds are unsigned, so first launches show
# a security prompt (see README). Add Apple / Windows signing secrets here later to remove it.
name: Desktop app

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            test: true
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            test: false
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            test: true
          - name: Linux
            # The oldest supported runner, so the AppImage and .deb run on older distributions too.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            test: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Test the engine on this platform
        if: matrix.test
        run: npm test

      # Stages the engine and the Node.js runtime for the target (desktop/stage.mjs), then bundles.
      - name: Build the app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Lay out the disk image window (background picture, icon positions) on CI too.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        run: |
          args=(build --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}")
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            args+=(--config src-tauri/tauri.updater.conf.json)
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: this build has no signed update bundles, so installed apps will not be offered it as an update."
          fi
          npx tauri "${args[@]}"

      # Both macOS builds name their update bundle ShibaSlim.app.tar.gz; give each its architecture.
      - name: Name the macOS update bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          arch=$([ "${{ matrix.target }}" = aarch64-apple-darwin ] && echo aarch64 || echo x64)
          version=$(node -p "require('./package.json').version")
          for ext in app.tar.gz app.tar.gz.sig; do
            if [ -f "$dir/ShibaSlim.$ext" ]; then mv "$dir/ShibaSlim.$ext" "$dir/ShibaSlim_${version}_${arch}.$ext"; fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ShibaSlim-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/*/*.sig

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # For desktop/latest-json.mjs.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Each artifact keeps its bundle sub-folder (dmg/, nsis/, appimage/, deb/, macos/); gather the files in
      # one place and make sure all five installers are there before anything is published.
      - name: Collect installers
        run: |
          mkdir installers
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \
            -o -name '*.app.tar.gz' -o -name '*.sig' \) -exec mv {} installers/ \;
          ls -l installers
          test "$(ls installers | grep -cE '\.(dmg|exe|AppImage|deb)$')" -eq 5

      # The manifest installed apps read to find this version (see plugins.updater in tauri.conf.json).
      - name: Write the update manifest
        run: node desktop/latest-json.mjs installers "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: installers/*
