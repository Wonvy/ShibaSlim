[package]
name = "shibaslim"
version = "0.2.0"
description = "ShibaSlim desktop app: compress the images inside PowerPoint files"
authors = ["Wonvy"]
license = "MIT"
repository = "https://github.com/Wonvy/ShibaSlim"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
tauri-plugin-opener = "2.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2.14.1"
tauri-plugin-dialog = "2.8.4"
sys-locale = "0.3.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
