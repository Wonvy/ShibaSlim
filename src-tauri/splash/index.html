<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ShibaSlim</title>
<style>
  :root { --bg: #f6f6f4; --text: #1d1d1f; --muted: #6e6e73; --line: #e3e3e0; --card: #fff; --bad: #d9480f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141414; --text: #ececec; --muted: #9b9b9b; --line: #2f2f2f; --card: #1e1e1e; --bad: #ff8787; }
  }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    -webkit-user-select: none; user-select: none; cursor: default;
  }
  main { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px; max-width: 640px; text-align: center; }
  svg { width: 72px; height: 72px; }
  h1 { margin: 0; font-size: 20px; }
  #status { margin: 0; color: var(--muted); }
  #status::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .error #status { color: var(--bad); font-weight: 600; }
  .error #status::after { content: none; }
  pre {
    display: none; width: min(560px, 90vw); max-height: 40vh; overflow: auto; margin: 0; padding: 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-align: left; white-space: pre-wrap;
    -webkit-user-select: text; user-select: text;
  }
  .error pre { display: block; }
  #hint { display: none; margin: 0; color: var(--muted); font-size: 13px; }
  .error #hint { display: block; }
</style>
<script src="splash.js"></script>
</head>
<body>
<main>
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f59a4a"/>
        <stop offset="1" stop-color="#e2611f"/>
      </linearGradient>
    </defs>
    <rect width="64" height="64" rx="14" fill="url(#bg)"/>
    <rect x="18" y="20" width="28" height="24" rx="3" fill="#fff"/>
    <circle cx="38.5" cy="27" r="2.6" fill="#f59a4a"/>
    <path d="M22 39l6-7 5 5 4-4 5 6z" fill="#e2611f"/>
    <path d="M8 32h6M50 32h6M11 28l4 4-4 4M53 28l-4 4 4 4" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>
  <h1>ShibaSlim</h1>
  <p id="status"></p>
  <pre id="details"></pre>
  <p id="hint"></p>
</main>
</body>
</html>
